name: tourism_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Dependencies for offline-first data management with Supabase
  brick_offline_first_with_supabase: ^2.1.0
  brick_supabase: ^2.1.1
  sqflite: ^2.4.2+1
  brick_sqlite: ^4.1.0+1
  uuid: ^4.5.3
    
  # Dependencies for Excel export
  excel: ^2.0.0
  path_provider: ^2.1.2
  open_file: ^3.3.2

  cupertino_icons: ^1.0.8 

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Dev dependencies for offline-first data management with Supabase
  brick_offline_first_with_supabase_build: ^2.1.0
  build_runner: ^2.15.0
  # For windows app size
  window_manager: ^0.3.0  # Recommended for testing, but not required. See https://pub.dev/packages/window_manager for more details.

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true


