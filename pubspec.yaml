name: tourism_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Dependencies for offline-first data management with Supabase
  brick_offline_first_with_supabase: ^2.1.0
  sqflite: ^2.4.2+1
  sqflite_common: ^2.5.7  
  sqflite_common_ffi: ^2.4.0+3
  brick_sqlite: ^4.1.0+1
  brick_supabase: ^2.1.1
  brick_offline_first: ^4.0.2
  uuid: ^4.5.3
  supabase_flutter: ^2.12.4

    
  # Dependencies for Excel export
  excel: ^4.0.6
  path_provider: ^2.1.5
  open_file: ^3.3.2

  cupertino_icons: ^1.0.8 
  window_manager: ^0.5.1
  file_picker: ^8.1.3
  brick_core: ^2.1.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  pdf: ^3.12.0
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Dev dependencies for offline-first data management with Supabase
  brick_offline_first_with_supabase_build: ^2.1.0
  build_runner: ^2.15.0

  # For windows app size

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true


